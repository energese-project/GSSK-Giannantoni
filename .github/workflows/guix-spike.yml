name: Guix reproducibility spike

# Rebuilds the WASM kernel on x86_64 from spike/guix/ and checks it against the
# hashes recorded from an aarch64 build. Same bytes from a different machine
# architecture is the claim an archived, re-runnable kernel rests on.
#
# Unlike the Apple-container run that produced spike/guix/wasm.sha256, the
# daemon here runs WITH build isolation (chroot), so `guix build --check` works.

on:
  pull_request:
    branches: [ main, 'feat/**', 'fix/**', 'docs/**' ]
    paths: [ 'spike/guix/**', '.github/workflows/guix-spike.yml' ]

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Guix from Ubuntu's archive
        # Ubuntu ships Guix 1.4.0. time-machine below moves to the pinned 1.5.0
        # commit, so this also tests that an OLDER Guix reproduces the pin.
        # (Installing from ftp.gnu.org was tried first; it was unreachable.)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q guix
          guix --version | head -1
          for k in /usr/share/guix/ci.guix.gnu.org.pub /usr/share/guix/bordeaux.guix.gnu.org.pub; do
            [ -f "$k" ] && sudo guix archive --authorize < "$k" || true
          done
          systemctl is-active guix-daemon || sudo systemctl start guix-daemon

      - name: Build via time-machine (pinned channels)
        run: |
          guix time-machine -C spike/guix/channels.scm -- \
            build --fallback -f spike/guix/gssk.scm | tee /tmp/out-path
          P=$(tail -1 /tmp/out-path)
          (cd "$P/share/gssk" && sha256sum gssk.wasm gssk-cli.wasm) | tee /tmp/wasm.sha256

      - name: Same bytes as the aarch64 build?
        run: |
          if diff spike/guix/wasm.sha256 /tmp/wasm.sha256; then
            echo "IDENTICAL across aarch64 and x86_64"
          else
            echo "::error::x86_64 WASM differs from the aarch64 build"; exit 1
          fi

      - name: guix build --check (rebuild each package, compare bits)
        run: |
          GSSK_GUIX_ALL=1 guix time-machine -C spike/guix/channels.scm -- \
            build --check --keep-failed -f spike/guix/gssk.scm

      - name: Pack an image and run the regression suite under Docker
        run: |
          T=$(guix time-machine -C spike/guix/channels.scm -- \
                pack -f docker --entry-point=bin/bash -S /bin=bin -S /share=share \
                wasm3 bash coreutils diffutils -e "(load \"$PWD/spike/guix/gssk.scm\")" | tail -1)
          sha256sum "$T"
          docker load -i "$T" | tee /tmp/load.txt
          IMG=$(sed -n 's/^Loaded image: //p' /tmp/load.txt)
          docker run --rm -v "$PWD:/work" "$IMG" -c '
            cd /work; R=/work/r; mkdir -p $R; ok=0; bad=0
            for m in examples/*.json; do n=$(basename $m .json)
              [ -f tests/expected/$n.csv ] || continue
              wasm3 --dir . /share/gssk/gssk-cli.wasm $m r/$n.csv >/dev/null 2>&1
              if cmp -s r/$n.csv tests/expected/$n.csv; then ok=$((ok+1)); else bad=$((bad+1)); echo "DIFF $n"; fi
            done
            echo "byte-identical=$ok differing=$bad"; [ $bad -eq 0 ]'
